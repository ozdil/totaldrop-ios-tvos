[package]
name = "totaldrop-apple-mobile-bridge"
description = "Safe Rust bridge for TotalDrop on iOS, iPadOS, and tvOS: Universal Links, Share Extension manifests, background checkpoints, 10-foot pairing, and 35-language Dynamic Type strings"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
totaldrop-core = { version = "0.2.0-beta.5", path = "../totaldrop-core" }
totaldrop-l10n = { version = "0.2.0-beta.5", path = "../totaldrop-l10n" }
totaldrop-proto = { version = "0.2.0-beta.5", path = "../totaldrop-proto" }

[lints]
workspace = true
